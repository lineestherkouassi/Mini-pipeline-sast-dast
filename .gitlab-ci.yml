
stages:
  - build
  - test
  - sast
  - docker
  - scan
  - deploy
  - dast

variables:
  IMAGE_NAME: devsecops-demo

# ==================== BUILD ====================
build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

# ==================== TEST ====================
test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn test
  dependencies:
    - build

sast:
  stage: sast
  script:
    - mvn verify

docker-build:
  stage: docker
  script:
    - docker build -t $IMAGE_NAME .

trivy-scan:
  stage: scan
  image: aquasec/trivy
  script:
    - trivy image $IMAGE_NAME

deploy:
  stage: deploy
  script:
    - docker run -d -p 8080:8080 $IMAGE_NAME

dast:
  stage: dast
  script:
    - docker run --rm -v ${PWD}:/zap/wrk/:rw -t zaproxy/zap-stable zap-baseline.py -t http://host.docker.internal:8080 -r zap-report.html